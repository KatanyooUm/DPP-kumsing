<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="calc.css">
    </head>
    <body>

        <form id="calculator">
            <input type="text" id="left">

            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>
        <input type="text" id="right">

        <input type="submit" value="Try me!">
        </form>

        <script src="calc.js"></script>
    </body>
</html>
